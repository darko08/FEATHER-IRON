<title>Feather &amp; Iron Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Saira+Stencil+One&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: a field manual. Sticky index rail on the left, one page of the manual at a time on the right. */
:root{
  --paper:#ece4cc; --sheet:#f5efdc; --ink:#1f1c15; --ink2:#55503f; --rule:#c9bd99;
  --rust:#a3442a; --brass:#8a6d2f; --olive:#4f6b3a; --steel:#4a504d; --rail:#24251d; --railink:#e8dfc4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#d8ceb0;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --f-display:'Saira Stencil One',Impact,sans-serif; --f-label:'Big Shoulders Display','Arial Narrow',sans-serif;
  --f-body:'Literata',Georgia,serif; --f-data:'Courier Prime','Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1c1d17; --sheet:#25261f; --ink:#ebe3cc; --ink2:#b9b09a; --rule:#43443a;
  --rust:#e07a5f; --brass:#d6ac4e; --olive:#8fb862; --steel:#6d726e; --rail:#141510; --railink:#e8dfc4;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#36372e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1c1d17; --sheet:#25261f; --ink:#ebe3cc; --ink2:#b9b09a; --rule:#43443a;
  --rust:#e07a5f; --brass:#d6ac4e; --olive:#8fb862; --steel:#6d726e; --rail:#141510; --railink:#e8dfc4;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#36372e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
a{color:var(--rust)}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:400;line-height:1.15}
h1{font-family:var(--f-display);font-size:clamp(30px,4vw,44px)}
h2{font-family:var(--f-display);font-size:25px;margin-top:6px}
h3{font-family:var(--f-label);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
p{margin:0}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto;background:var(--rail);color:var(--railink);padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:18px}
.brand b{display:block;font-family:var(--f-display);font-size:22px;letter-spacing:.03em}
.brand small{font-family:var(--f-label);letter-spacing:.16em;text-transform:uppercase;color:#b9ab84;font-size:12.5px}
.toc{display:flex;flex-direction:column;gap:4px}
.toc a{display:flex;flex-direction:column;gap:0;color:var(--railink);text-decoration:none;padding:7px 10px;border-left:4px solid transparent;font-family:var(--f-label);font-weight:700;font-size:16.5px;letter-spacing:.05em;text-transform:uppercase}
.toc a span{font-family:var(--f-data);font-size:11.5px;color:#8f8a77;letter-spacing:0;text-transform:none;font-weight:400}
.toc a:hover{background:rgba(232,223,196,.08)}
.toc a[aria-current="page"]{border-left-color:#e07a5f;background:rgba(232,223,196,.12)}
.toc a:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.railnote{margin-top:auto;font-family:var(--f-data);font-size:12px;color:#8f8a77;line-height:1.5}
main{min-width:0;padding-block:34px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.page{max-width:980px;display:flex;flex-direction:column;gap:22px}
.page[hidden]{display:none!important}
.eyebrow{font-family:var(--f-label);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--brass)}
.lede{font-size:18.5px;max-width:68ch;color:var(--ink2)}
.prose{display:flex;flex-direction:column;gap:12px;max-width:70ch}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.stamp{display:inline-flex;align-self:flex-start;gap:6px;align-items:center;font-family:var(--f-label);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;border:2px solid var(--rust);color:var(--rust);padding:2px 10px;transform:rotate(-1.2deg)}
.stamp.ok{border-color:var(--olive);color:var(--olive)}
.sheet{background:var(--sheet);border:1px solid var(--rule);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--sheet);border:1px solid var(--rule);border-top:4px solid var(--steel);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.rust{border-top-color:var(--rust)}.card.olive{border-top-color:var(--olive)}.card.brass{border-top-color:var(--brass)}
.card h3{font-size:17px}
.card p{font-size:15.5px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-family:var(--f-label);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;text-align:left;padding:8px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:7px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.callout{border-left:5px solid var(--rust);background:var(--sheet);padding:12px 16px;display:flex;flex-direction:column;gap:6px;max-width:78ch}
.callout.olive{border-left-color:var(--olive)}.callout.brass{border-left-color:var(--brass)}
.callout b.t{font-family:var(--f-label);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--sheet);border:1px solid var(--rule);padding:10px 14px;min-width:0}
.kpi small{display:block;font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:12.5px;color:var(--ink2)}
.kpi b{display:block;font-family:var(--f-data);font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink2)}
.controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 18px}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctl label{font-family:var(--f-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
.ctl label output{font-family:var(--f-data);text-transform:none;letter-spacing:0;color:var(--rust)}
.ctl small{font-size:12.5px;color:var(--ink2);line-height:1.35}
input[type=range]{width:100%;accent-color:var(--rust)}
input[type=number]{width:100%;font-family:var(--f-data);font-size:15px;padding:6px 8px;border:1.5px solid var(--ink2);background:var(--paper);color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--f-label);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:7px 14px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ttl{font-family:var(--f-label);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:14px;margin-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;color:var(--ink2);margin-bottom:4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-family:var(--f-data);font-size:12.5px;padding:6px 9px;line-height:1.45;white-space:nowrap;z-index:2}
.tip[hidden]{display:none!important}
svg text{font-family:var(--f-data);font-size:11px;fill:var(--ink2)}
.diagram{overflow-x:auto}
.foot{font-family:var(--f-data);font-size:12.5px;color:var(--ink2);border-top:1px solid var(--rule);padding-top:12px;max-width:78ch}
@media (max-width:980px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:auto;flex-direction:column;gap:10px;padding-block:12px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .toc{flex-direction:row;overflow-x:auto;gap:2px;padding-bottom:4px}
  .toc a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;font-size:15px}
  .toc a span,.railnote{display:none}
  .toc a[aria-current="page"]{border-bottom-color:#e07a5f}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 48px}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
